<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard – DJ AI Partnership LLC</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="portal.css">
<style>.mail{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:#080b11}.mail summary{cursor:pointer;font-weight:600}.mail .code{display:inline-block;background:#1a2219;color:var(--accent);font:700 20px "Space Grotesk";letter-spacing:3px;padding:4px 10px;border-radius:8px;margin:6px 0}.mail pre{white-space:pre-wrap;word-break:break-word;font:14px "DM Sans";color:var(--muted);margin:8px 0 0;max-height:260px;overflow:auto}</style>
</head>
<body>
<div class="wrap wide">
  <div class="top"><a href="index.html"><img src="logo.png" alt="DJ AI Partnership LLC" class="logo"></a>
    <div style="display:flex;gap:10px;align-items:center"><div class="lang"><button data-l="en" class="on">EN</button><button data-l="fr">FR</button></div>
    <button id="out" class="btn ghost" style="width:auto;margin:0;padding:8px 14px;font-size:14px" data-en="Log out" data-fr="Déconnexion"></button></div></div>

  <p class="eyebrow" data-en="CONTRIBUTOR DASHBOARD" data-fr="TABLEAU DE BORD CONTRIBUTEUR"></p>
  <h1 style="font-size:clamp(32px,6vw,46px)"><span data-en="Welcome" data-fr="Bienvenue"></span><em id="who"></em></h1>
  <p class="small"><span class="badge" id="status">APPLICANT</span> &nbsp;<span id="verify" class="hide" data-en="Please verify your email: check your inbox." data-fr="Veuillez vérifier votre email : consultez votre boîte de réception."></span></p>

  <div class="grid">
    <div class="stat"><span class="small" data-en="Hours submitted" data-fr="Heures soumises"></span><b id="sSub">0</b></div>
    <div class="stat"><span class="small" data-en="Hours approved" data-fr="Heures approuvées"></span><b id="sApp">0</b></div>
    <div class="stat"><span class="small" data-en="Quality score" data-fr="Score qualité"></span><b id="sQual">—</b></div>
    <div class="stat"><span class="small" data-en="Earnings (USD)" data-fr="Gains (USD)"></span><b id="sEarn">$0.00</b></div>
    <div class="stat"><span class="small" data-en="Paid out (USD)" data-fr="Déjà payé (USD)"></span><b id="sPaid">$0.00</b></div>
  </div>
  <p class="small" data-en="Hours and quality appear about one day after submission. Only client-approved hours are paid." data-fr="Les heures et la qualité apparaissent environ un jour après la soumission. Seules les heures approuvées par le client sont payées."></p>

  <div class="panel" id="slack">
    <h2 style="margin-top:0" data-en="Join the DJAI Slack" data-fr="Rejoindre le Slack DJAI"></h2>
    <p class="small" data-en="All contributors join our Slack. Start with #onboarding-process and read the pinned message." data-fr="Tous les contributeurs rejoignent notre Slack. Commencez par #onboarding-process et lisez le message épinglé."></p>
    <a class="btn primary" style="display:inline-block;width:auto;padding:12px 20px;text-decoration:none" href="https://join.slack.com/t/djaipartnershipllc/shared_invite/zt-4cgu30b93-bD69GZF0~lw9Q~TbGz1lQQ" target="_blank" rel="noopener" data-en="Join Slack" data-fr="Rejoindre Slack"></a>
  </div>

  <div class="panel" id="minute">
    <h2 style="margin-top:0" data-en="Start recording on Minute" data-fr="Commencer à filmer sur Minute"></h2>
    <div class="grid" style="margin-top:10px">
      <div class="stat"><span class="small" data-en="Your DJAI email" data-fr="Votre email DJAI"></span><b id="wEmail" style="font-size:20px;word-break:break-all">—</b></div>
      <div class="stat hide" id="orgBox"><span class="small" data-en="Organization Code" data-fr="Code de l'organisation"></span><b id="orgCode" style="font-size:24px;letter-spacing:2px">—</b></div>
    </div>
    <p id="noEmail" class="small hide" data-en="Fill in and save your profile below to receive your DJAI email and the Organization Code." data-fr="Remplissez et enregistrez votre profil ci-dessous pour recevoir votre email DJAI et le code de l'organisation."></p>
    <ol class="small" style="line-height:1.9;padding-left:20px">
      <li data-en="Download the Minute app on your smartphone." data-fr="Téléchargez l'application Minute sur votre smartphone."></li>
      <li data-en="Create your Minute account with your DJAI email above (not your personal email)." data-fr="Créez votre compte Minute avec votre email DJAI ci-dessus (pas votre email personnel)."></li>
      <li data-en="Verification codes sent to your DJAI email appear in the inbox below." data-fr="Les codes de vérification envoyés à votre email DJAI apparaissent dans la boîte ci-dessous."></li>
      <li data-en="Enter the Organization Code, then start recording. Your hours appear here about one day later." data-fr="Entrez le code de l'organisation, puis commencez à filmer. Vos heures apparaissent ici environ un jour plus tard."></li>
    </ol>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><h3 style="margin:0" data-en="DJAI inbox" data-fr="Boîte de réception DJAI"></h3>
      <button id="inboxRefresh" class="btn ghost" type="button" style="width:auto;margin:0;padding:8px 14px;font-size:14px" data-en="Refresh" data-fr="Actualiser"></button></div>
    <div id="inbox"><p class="small" data-en="No messages yet." data-fr="Aucun message pour l'instant."></p></div>
  </div>

  <form id="pf" class="panel">
    <h2 style="margin-top:0" data-en="Your profile" data-fr="Votre profil"></h2>
    <div class="row">
      <div><label data-en="Full name" data-fr="Nom complet"></label><input id="name" required></div>
      <div><label data-en="Phone / WhatsApp" data-fr="Téléphone / WhatsApp"></label><input id="phone" required type="tel" placeholder="+509 ..."></div>
      <div><label data-en="Country" data-fr="Pays"></label><select id="country" required><option value="">—</option><option>Haiti</option><option>Dominican Republic</option><option>United States</option><option>Canada</option><option>France</option><option value="Other">Other / Autre</option></select></div>
      <div><label data-en="City" data-fr="Ville"></label><input id="city" required></div>
      <div><label data-en="Languages" data-fr="Langues"></label><input id="langs" data-ph-en="e.g. Haitian Creole, French, English" data-ph-fr="ex. créole, français, anglais"></div>
      <div><label data-en="Smartphone model" data-fr="Modèle de smartphone"></label><input id="phoneModel" required data-ph-en="iPhone 12+, Galaxy S21+, Pixel 6+" data-ph-fr="iPhone 12+, Galaxy S21+, Pixel 6+"></div>
      <div><label data-en="Do you have a headstrap?" data-fr="Avez-vous un support de tête ?"></label><select id="strap" required><option value="">—</option><option value="yes" data-en="Yes" data-fr="Oui"></option><option value="can-get" data-en="I can get one" data-fr="Je peux en obtenir un"></option><option value="no" data-en="No" data-fr="Non"></option></select></div>
      <div><label data-en="Hours available per week" data-fr="Heures disponibles par semaine"></label><input id="avail" type="number" min="0" max="80"></div>
    </div>
    <label data-en="Work environment you can record (e.g. salon, gym, farm, kitchen)" data-fr="Environnement de travail que vous pouvez filmer (ex. salon, gym, ferme, cuisine)"></label><input id="env">

    <h2 data-en="Payout method" data-fr="Moyen de paiement"></h2>
    <div class="pay">
      <label><input type="radio" name="pm" value="moncash">MonCash</label>
      <label><input type="radio" name="pm" value="natcash">NatCash</label>
      <label><input type="radio" name="pm" value="bank"><span data-en="Bank transfer" data-fr="Virement bancaire"></span></label>
      <label><input type="radio" name="pm" value="payoneer">Payoneer</label>
      <label><input type="radio" name="pm" value="wise">Wise</label>
    </div>
    <div id="pmFields" class="row" style="margin-top:6px"></div>
    <p class="small" data-en="Never enter passwords or PIN codes. We only need the details to send you money." data-fr="N'entrez jamais de mot de passe ni de code PIN. Nous avons seulement besoin des informations pour vous envoyer l'argent."></p>

    <button class="btn primary" type="submit" data-en="Save profile" data-fr="Enregistrer le profil"></button>
    <p id="msg" class="msg"></p>
  </form>
  <p class="small center"><span data-en="Questions?" data-fr="Des questions ?"></span> <a class="link" href="mailto:contact@jdaipartnership.com">contact@jdaipartnership.com</a></p>
</div>
<script src="i18n.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id), T = (en, fr) => (window.LANG === "fr" ? fr : en);
const PM = {
  moncash: [["mcName","Name on MonCash account","Nom du compte MonCash"],["mcPhone","MonCash phone number","Numéro MonCash"]],
  natcash: [["ncName","Name on NatCash account","Nom du compte NatCash"],["ncPhone","NatCash (Natcom) phone number","Numéro NatCash (Natcom)"]],
  bank: [["bkHolder","Account holder name","Titulaire du compte"],["bkName","Bank name","Nom de la banque"],["bkAcct","Account number / IBAN","Numéro de compte / IBAN"],["bkSwift","SWIFT / routing (if any)","SWIFT / code (si applicable)"],["bkCountry","Bank country","Pays de la banque"]],
  payoneer: [["poEmail","Payoneer account email","Email du compte Payoneer"]],
  wise: [["wsEmail","Wise account email","Email du compte Wise"],["wsName","Full name on Wise","Nom complet sur Wise"]]
};
const F = { name:"name", phone:"phone", country:"country", city:"city", langs:"langs", phoneModel:"phone_model", strap:"strap", avail:"avail", env:"env" };
let data = {}, user = null;
function renderPM(){ const m = (document.querySelector('input[name=pm]:checked')||{}).value; const box = $("pmFields"); const keep = {};
  box.querySelectorAll("input").forEach(i => keep[i.id] = i.value); box.innerHTML = "";
  (PM[m]||[]).forEach(([id,en,fr]) => { const d=document.createElement("div"); d.innerHTML=`<label data-en="${en}" data-fr="${fr}"></label><input id="${id}" required>`; box.appendChild(d);
    d.querySelector("input").value = keep[id] ?? ((data.payout && data.payout[id]) || ""); }); window.applyLang(); }
document.querySelectorAll('input[name=pm]').forEach(r => r.onchange = renderPM);
(async () => {
  const { data: s } = await sb.auth.getSession();
  if(!s.session){ location.href = "apply.html?mode=login"; return; }
  user = s.session.user; $("who").textContent = ", " + user.email;
  const { data: p } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if(!p) await sb.from("profiles").upsert({ id:user.id, email:user.email, referral:(user.user_metadata||{}).referral||null });
  data = p || {};
  Object.entries(F).forEach(([el,col]) => { if(data[col]!=null) $(el).value = data[col]; });
  $("status").textContent = (data.status||"applicant").toUpperCase();
  if(data.payout && data.payout.method){ const r=document.querySelector(`input[name=pm][value=${data.payout.method}]`); if(r){ r.checked=true; renderPM(); } }
  const { data: x } = await sb.from("stats").select("*").eq("id", user.id).maybeSingle();
  if(x){ $("sSub").textContent = x.submitted_hours ?? 0; $("sApp").textContent = x.approved_hours ?? 0;
    $("sQual").textContent = x.quality!=null ? x.quality + "%" : "—";
    $("sEarn").textContent = "$" + Number(x.earnings_usd||0).toFixed(2); $("sPaid").textContent = "$" + Number(x.paid_usd||0).toFixed(2); }
  loadMinute();
})();
$("pf").onsubmit = async e => { e.preventDefault(); if(!user) return;
  const m = (document.querySelector('input[name=pm]:checked')||{}).value;
  if(!m){ $("msg").className="msg err"; $("msg").textContent=T("Choose a payout method.","Choisissez un moyen de paiement."); return; }
  const payout = { method:m }; (PM[m]||[]).forEach(([id]) => payout[id] = $(id).value.trim());
  const upd = { id:user.id, email:user.email, payout, updated_at:new Date().toISOString() };
  Object.entries(F).forEach(([el,col]) => { const v=$(el).value.trim(); upd[col] = col==="avail" ? (v===""?null:parseInt(v,10)) : v; });
  const { error } = await sb.from("profiles").upsert(upd);
  if(!error) loadMinute();
  $("msg").className = "msg " + (error?"err":"ok");
  $("msg").textContent = error ? T("Could not save. Please try again.","Échec de l'enregistrement. Réessayez.") : T("Profile saved. Our team will contact you about next steps.","Profil enregistré. Notre équipe vous contactera pour la suite."); };
$("out").onclick = async () => { await sb.auth.signOut(); location.href="index.html"; };

const esc = t => String(t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let PostalMime = null;
async function loadMinute(){
  const { data: st } = await sb.from("app_settings").select("value").eq("key","minute_org_code").maybeSingle();
  const { data: p } = await sb.from("profiles").select("work_email,name,phone,country,city").eq("id", user.id).maybeSingle();
  const we = p && p.work_email;
  const complete = !!(we && p.name && p.phone && p.country && p.city);
  $("wEmail").textContent = we || "—";
  $("orgCode").textContent = complete ? ((st && st.value) || "5PNDPR2S") : "—";
  $("orgBox").classList.toggle("hide", !complete);
  $("noEmail").classList.toggle("hide", complete);
  if(we) loadInbox();
}
async function loadInbox(){
  const { data: rows } = await sb.from("inbox").select("id,from_address,subject,raw,received_at").order("received_at",{ascending:false}).limit(20);
  const box = $("inbox"); if(!rows || !rows.length) return;
  if(!PostalMime){ try { PostalMime = (await import("https://esm.sh/postal-mime@2")).default; } catch(e){} }
  box.innerHTML = "";
  for(const r of rows){
    let text = "";
    try { if(PostalMime){ const m = await PostalMime.parse(r.raw); text = m.text || (m.html||"").replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<[^>]+>/g," ").replace(/\s+/g," "); } } catch(e){}
    if(!text) text = (r.raw||"").split(/\r?\n\r?\n/).slice(1).join("\n").slice(0,3000);
    const code = ((r.subject + " " + text).match(/\b\d{4,8}\b/)||[])[0];
    const d = document.createElement("details"); d.className = "mail";
    d.innerHTML = `<summary>${esc(r.subject||"(no subject)")}</summary><div class="small">${esc(r.from_address)} · ${new Date(r.received_at).toLocaleString()}</div>${code?`<div class="code">${esc(code)}</div>`:""}<pre>${esc(text.slice(0,4000))}</pre>`;
    box.appendChild(d);
  }
}
$("inboxRefresh").onclick = loadInbox;
document.addEventListener("langchange", renderPM);
</script>
</body>
</html>
