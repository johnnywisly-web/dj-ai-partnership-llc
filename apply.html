<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply – DJ AI Partnership LLC</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="portal.css">
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html"><img src="logo.png" alt="DJ AI Partnership LLC" class="logo"></a>
    <div class="lang"><button data-l="en" class="on">EN</button><button data-l="fr">FR</button></div></div>

  <p class="eyebrow" data-en="PAID AI TRAINING PROJECTS" data-fr="PROJETS RÉMUNÉRÉS D'ENTRAÎNEMENT IA"></p>
  <h1><span data-en="Join the people" data-fr="Rejoignez ceux qui"></span><br><span data-en="powering " data-fr="font "></span><em data-en="the future of AI." data-fr="avancer l'IA."></em></h1>
  <p class="lead" data-en="Create a DJ AI Partnership profile to be matched with paid real-world video capture and AI data projects." data-fr="Créez votre profil DJ AI Partnership pour être sélectionné sur des projets rémunérés de capture vidéo réelle et de données IA."></p>

  <div id="tabs" class="tabs"><button id="tSign" class="on" data-en="Create account" data-fr="Créer un compte"></button><button id="tLog" data-en="Log in" data-fr="Se connecter"></button></div>

  <h2 id="formTitle" data-en="Create your DJAI profile" data-fr="Créez votre profil DJAI"></h2>
  <p class="small" data-en="Sign up with your personal email. Each profile is an individual contractor account." data-fr="Inscrivez-vous avec votre email personnel. Chaque profil est un compte de contractant individuel."></p>

  <form id="f">
    <label data-en="Email" data-fr="Email"></label>
    <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
    <label data-en="Password" data-fr="Mot de passe"></label>
    <div class="pw"><input id="pass" type="password" required minlength="8" autocomplete="new-password" data-ph-en="Create a password (8+ characters)" data-ph-fr="Créez un mot de passe (8+ caractères)"><button type="button" id="eye" aria-label="show">👁</button></div>
    <div id="signOnly">
      <a href="#" id="refT" class="ref">+ <span data-en="Have a referral code?" data-fr="Vous avez un code de parrainage ?"></span></a>
      <input id="ref" class="hide" data-ph-en="Referral code" data-ph-fr="Code de parrainage">
      <label class="chk"><input type="checkbox" id="agree"><span data-en="I confirm my information is accurate and I agree to the DJ AI Partnership contractor terms, privacy rules and confidentiality requirements." data-fr="Je confirme que mes informations sont exactes et j'accepte les conditions contractuelles, les règles de confidentialité et de protection des données de DJ AI Partnership."></span></label>
    </div>
    <button id="go" class="btn primary" type="submit" data-en="Continue" data-fr="Continuer"></button>
    <a href="#" id="forgot" class="small link hide" data-en="Forgot password?" data-fr="Mot de passe oublié ?"></a>
    <p id="msg" class="msg"></p>
  </form>
  <p class="small center"><span data-en="Are you a business interested in bringing your workforce?" data-fr="Vous êtes une entreprise et voulez apporter votre équipe ?"></span> <a class="link" href="mailto:contact@jdaipartnership.com">contact@jdaipartnership.com</a></p>
</div>
<script src="i18n.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let mode = "sign"; const $ = id => document.getElementById(id), T = (en, fr) => (window.LANG === "fr" ? fr : en);
const msg = (t, ok) => { $("msg").textContent = t; $("msg").className = "msg " + (ok ? "ok" : "err"); };
function setMode(m){ mode=m; $("tSign").classList.toggle("on",m==="sign"); $("tLog").classList.toggle("on",m==="log");
  $("signOnly").classList.toggle("hide",m!=="sign"); $("forgot").classList.toggle("hide",m==="sign");
  $("pass").autocomplete = m==="sign" ? "new-password" : "current-password";
  $("formTitle").dataset.en = m==="sign"?"Create your DJAI profile":"Log in to your dashboard";
  $("formTitle").dataset.fr = m==="sign"?"Créez votre profil DJAI":"Connectez-vous à votre tableau de bord"; window.applyLang(); msg(""); }
$("tSign").onclick=()=>setMode("sign"); $("tLog").onclick=()=>setMode("log");
$("eye").onclick=()=>{ $("pass").type = $("pass").type==="password"?"text":"password"; };
$("refT").onclick=e=>{ e.preventDefault(); $("ref").classList.toggle("hide"); };
$("f").onsubmit = async e => { e.preventDefault(); const email=$("email").value.trim(), password=$("pass").value; $("go").disabled=true;
  try{
    if(mode==="sign"){
      if(!$("agree").checked){ msg(T("Please accept the terms to continue.","Veuillez accepter les conditions pour continuer.")); return; }
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ referral:$("ref").value.trim() } } });
      if(error) throw error;
      if(!data.session){ msg(T("Account created. Check your email to confirm, then log in.","Compte créé. Confirmez via l'email reçu, puis connectez-vous."),true); setMode("log"); return; }
      await sb.from("profiles").upsert({ id:data.user.id, email, referral:$("ref").value.trim()||null });
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password }); if(error) throw error;
    }
    location.href="dashboard.html";
  } catch(err){ const m=(err.message||"").toLowerCase();
    msg(m.includes("already")?T("This email already has an account. Log in instead.","Cet email a déjà un compte. Connectez-vous."):
      m.includes("password should")||m.includes("weak")?T("Password must be at least 8 characters.","Le mot de passe doit contenir au moins 8 caractères."):
      m.includes("invalid login")?T("Email or password is incorrect.","Email ou mot de passe incorrect."):
      m.includes("not confirmed")?T("Please confirm your email first.","Veuillez d'abord confirmer votre email."):
      T("Something went wrong. Please try again.","Une erreur est survenue. Réessayez."));
  } finally { $("go").disabled=false; } };
$("forgot").onclick = async e => { e.preventDefault(); const email=$("email").value.trim(); if(!email) return msg(T("Enter your email first.","Entrez d'abord votre email."));
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname.replace(/apply\.html$/,"") + "reset.html" });
  msg(error?T("Could not send the reset link.","Impossible d'envoyer le lien."):T("Reset link sent. Check your inbox.","Lien envoyé. Vérifiez votre boîte mail."), !error); };
sb.auth.getSession().then(({data}) => { if(data.session) location.href="dashboard.html"; });
if(new URLSearchParams(location.search).get("mode")==="login") setMode("log");
</script>
</body>
</html>
