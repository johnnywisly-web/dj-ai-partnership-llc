<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apply – DJ AI Partnership LLC</title>
<meta name="theme-color" content="#050c1f">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050c1f;--ink2:#0a1733;--navy:#0c1f47;--blue:#1d6bff;--cyan:#22c3ff;--violet:#7b5cff;
  --text:#eaf0fb;--mut:rgba(214,225,247,.72);--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.055);
  --r:22px;--grad:linear-gradient(120deg,var(--blue),var(--cyan));
  --fh:"Sora",Inter,system-ui,sans-serif;--fb:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
html{background:#050c1f}
body{margin:0;min-height:100vh;font-family:var(--fb);color:var(--text);background:var(--ink);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg::before{content:"";position:absolute;inset:0;z-index:-2;
  background:radial-gradient(60% 50% at 85% 0%,rgba(34,195,255,.24),transparent 70%),
             radial-gradient(50% 60% at 0% 100%,rgba(123,92,255,.26),transparent 70%),
             radial-gradient(40% 40% at 50% 45%,rgba(29,107,255,.14),transparent 70%)}
.bg::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(75% 65% at 50% 35%,#000,transparent);mask-image:radial-gradient(75% 65% at 50% 35%,#000,transparent)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);z-index:-1;pointer-events:none;animation:float 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:#1d6bff;opacity:.3;top:-90px;right:-70px}
.orb.b{width:260px;height:260px;background:#7b5cff;opacity:.28;bottom:-60px;left:-80px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,40px)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
a{color:inherit}
.hide{display:none!important}

/* header */
.top{max-width:1160px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{display:flex;align-items:center;background:#fff;border-radius:14px;padding:4px 10px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.brand img.logo{height:44px;width:96px;object-fit:cover;object-position:50% 48%;display:block}
.lang{display:flex;padding:4px;gap:2px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang button{background:transparent;color:var(--mut);border:0;padding:7px 14px;border-radius:999px;font:600 13px var(--fb);cursor:pointer;transition:background .2s,color .2s}
.lang button.on{background:var(--grad);color:#fff}

/* layout */
.shell{max-width:1160px;margin:0 auto;padding:18px 20px 56px;display:grid;gap:34px}
.intro{padding-top:8px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin:0}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--grad)}
h1,h2{font-family:var(--fh);letter-spacing:-.02em;margin:0;color:#fff}
h1{font-size:clamp(36px,6vw,62px);line-height:1.04;font-weight:800;margin:18px 0 16px}
h1 em{font-style:normal;background:linear-gradient(100deg,#7fd7ff,#ffffff 45%,#9fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(16px,1.6vw,18px);color:var(--mut);max-width:520px;margin:0}

/* card */
.card{position:relative;border-radius:28px;padding:22px 20px 24px;background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.035));border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 40px 80px -30px rgba(0,0,0,.7),0 0 0 8px rgba(255,255,255,.02)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(34,195,255,.55),transparent 40%,transparent 60%,rgba(123,92,255,.5));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tabs{display:flex;gap:4px;background:rgba(5,12,31,.55);border:1px solid var(--line);border-radius:999px;padding:5px}
.tabs button{flex:1;background:transparent;border:0;color:var(--mut);min-height:42px;padding:0 12px;border-radius:999px;font:600 14.5px var(--fb);cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.tabs button:hover{color:#fff}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 8px 22px -8px rgba(29,107,255,.7)}
h2{font-size:clamp(22px,3vw,27px);line-height:1.2;margin:24px 0 6px}
.small{color:var(--mut);font-size:14px;margin:0}
.center{text-align:center;margin:12px 0 0;padding-top:20px;border-top:1px solid var(--line)}

/* fields */
label{display:block;font-weight:600;font-size:14px;color:#fff;margin:18px 0 8px}
input,select,textarea{width:100%;background:rgba(5,12,31,.6);border:1px solid rgba(255,255,255,.16);border-radius:14px;color:#fff;padding:14px 16px;font:16px var(--fb);transition:border-color .2s,box-shadow .2s,background .2s;-webkit-appearance:none;appearance:none}
input::placeholder{color:rgba(214,225,247,.42)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,195,255,.18);background:rgba(5,12,31,.8)}
input:-webkit-autofill{-webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 1000px #0a1733 inset;caret-color:#fff}
.pw{position:relative}.pw input{padding-right:52px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;background:transparent;border:0;color:var(--mut);font-size:17px;cursor:pointer}
.pw button:hover{background:rgba(255,255,255,.08)}
.ref{display:inline-flex;align-items:center;gap:4px;color:var(--cyan);font-weight:600;font-size:14px;margin:16px 0 4px;text-decoration:none}
.ref:hover{text-decoration:underline}
#ref{margin-top:8px}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:400;color:var(--mut);font-size:13.5px;line-height:1.55;margin:18px 0 0;padding:14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line);cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin:1px 0 0;padding:0;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);background:transparent;cursor:pointer;display:grid;place-items:center}
.chk input:checked{background:var(--grad);border-color:transparent}
.chk input:checked::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:999px;font:600 16px var(--fb);cursor:pointer;border:0;margin-top:22px;text-decoration:none;transition:transform .25s ease,box-shadow .25s ease,filter .25s}
.primary{background:var(--grad);color:#fff;box-shadow:0 10px 30px -8px rgba(29,107,255,.6)}
.primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px -10px rgba(29,107,255,.7)}
.primary:disabled{opacity:.6;cursor:wait;transform:none}
.link{color:var(--cyan);text-decoration:none}.link:hover{text-decoration:underline}
#forgot,#resend{display:inline-block;margin-top:14px}
.msg{min-height:20px;font-size:14px;margin:12px 0 0}.msg.err{color:#ff9aa8}.msg.ok{color:#6fe3b4}
#codeF .small:first-child{margin-top:16px;padding:14px;border-radius:14px;background:rgba(34,195,255,.08);border:1px solid rgba(34,195,255,.25);color:rgba(230,240,255,.85)}
#code{letter-spacing:.3em;font-size:20px;text-align:center}

@media (min-width:600px){.card{padding:30px 30px 30px}.top{padding:20px 28px}.shell{padding:24px 28px 64px}}
@media (min-width:960px){
  .shell{grid-template-columns:1.05fr .95fr;align-items:center;gap:64px;padding-top:48px;min-height:calc(100vh - 100px)}
  .intro{padding-top:0}
  .card{padding:34px 36px 32px}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><span class="orb a"></span><span class="orb b"></span></div>
<header class="top"><a href="index.html" class="brand" aria-label="DJ AI Partnership LLC home"><img src="logo.png" alt="DJ AI Partnership LLC" class="logo"></a>
  <div class="lang"><button data-l="en" class="on">EN</button><button data-l="fr">FR</button></div></header>

<main class="shell">
 <section class="intro">
  <p class="eyebrow" data-en="PAID AI TRAINING PROJECTS" data-fr="PROJETS RÉMUNÉRÉS D'ENTRAÎNEMENT IA"></p>
  <h1><span data-en="Join the people" data-fr="Rejoignez ceux qui"></span><br><span data-en="powering " data-fr="font "></span><em data-en="the future of AI." data-fr="avancer l'IA."></em></h1>
  <p class="lead" data-en="Create a DJ AI Partnership profile to be matched with paid real-world video capture and AI data projects." data-fr="Créez votre profil DJ AI Partnership pour être sélectionné sur des projets rémunérés de capture vidéo réelle et de données IA."></p>
 </section>

 <section class="card">
  <div id="tabs" class="tabs"><button id="tSign" class="on" data-en="Create account" data-fr="Créer un compte"></button><button id="tLog" data-en="Log in" data-fr="Se connecter"></button></div>

  <h2 id="formTitle" data-en="Create your DJAI profile" data-fr="Créez votre profil DJAI"></h2>
  <p class="small" data-en="Sign up with your personal email. Each profile is an individual contractor account." data-fr="Inscrivez-vous avec votre email personnel. Chaque profil est un compte de contractant individuel."></p>

  <form id="f">
    <label data-en="Email" data-fr="Email"></label>
    <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
    <label data-en="Password" data-fr="Mot de passe"></label>
    <div class="pw"><input id="pass" type="password" required minlength="8" autocomplete="new-password" data-ph-en="Create a password (8+ characters)" data-ph-fr="Créez un mot de passe (8+ caractères)"><button type="button" id="eye" aria-label="show">👁</button></div>
    <div id="signOnly">
      <a href="#" id="refT" class="ref">+ <span data-en="Have a referral code?" data-fr="Vous avez un code de parrainage ?"></span></a>
      <input id="ref" class="hide" data-ph-en="Referral code" data-ph-fr="Code de parrainage">
      <label class="chk"><input type="checkbox" id="agree"><span data-en="I confirm my information is accurate and I agree to the DJ AI Partnership contractor terms, privacy rules and confidentiality requirements." data-fr="Je confirme que mes informations sont exactes et j'accepte les conditions contractuelles, les règles de confidentialité et de protection des données de DJ AI Partnership."></span></label>
    </div>
    <button id="go" class="btn primary" type="submit" data-en="Continue" data-fr="Continuer"></button>
    <a href="#" id="forgot" class="small link hide" data-en="Forgot password?" data-fr="Mot de passe oublié ?"></a>
    <p id="msg" class="msg"></p>
  </form>
  <form id="codeF" class="hide">
    <p class="small" id="codeInfo" data-en="We sent an 8-digit code to your email. Enter it below to activate your account. Check spam if you don't see it." data-fr="Nous avons envoyé un code à 8 chiffres à votre email. Entrez-le ci-dessous pour activer votre compte. Vérifiez les spams si vous ne le voyez pas."></p>
    <label data-en="Verification code" data-fr="Code de vérification"></label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required placeholder="12345678">
    <button id="codeGo" class="btn primary" type="submit" data-en="Verify and continue" data-fr="Vérifier et continuer"></button>
    <a href="#" id="resend" class="small link" data-en="Resend code" data-fr="Renvoyer le code"></a>
    <p id="msg2" class="msg"></p>
  </form>
  <p class="small center"><span data-en="Are you a business interested in bringing your workforce?" data-fr="Vous êtes une entreprise et voulez apporter votre équipe ?"></span> <a class="link" href="mailto:contact@jdaipartnership.com">contact@jdaipartnership.com</a></p>
 </section>
</main>
<script src="i18n.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let mode = "sign"; const $ = id => document.getElementById(id), T = (en, fr) => (window.LANG === "fr" ? fr : en);
const msg = (t, ok) => { $("msg").textContent = t; $("msg").className = "msg " + (ok ? "ok" : "err"); };
function setMode(m){ mode=m; $("tSign").classList.toggle("on",m==="sign"); $("tLog").classList.toggle("on",m==="log");
  $("signOnly").classList.toggle("hide",m!=="sign"); $("forgot").classList.toggle("hide",m==="sign");
  $("pass").autocomplete = m==="sign" ? "new-password" : "current-password";
  $("formTitle").dataset.en = m==="sign"?"Create your DJAI profile":"Log in to your dashboard";
  $("formTitle").dataset.fr = m==="sign"?"Créez votre profil DJAI":"Connectez-vous à votre tableau de bord"; window.applyLang(); msg(""); }
$("tSign").onclick=()=>setMode("sign"); $("tLog").onclick=()=>setMode("log");
$("eye").onclick=()=>{ $("pass").type = $("pass").type==="password"?"text":"password"; };
$("refT").onclick=e=>{ e.preventDefault(); $("ref").classList.toggle("hide"); };
(()=>{ const q=new URLSearchParams(location.search); const r=(q.get("ref")||q.get("referral")||"").trim(); if(r){ $("ref").value=r; $("ref").classList.remove("hide"); try{localStorage.setItem("djai_ref",r);}catch(e){} } else { try{ const s=localStorage.getItem("djai_ref"); if(s){ $("ref").value=s; $("ref").classList.remove("hide"); } }catch(e){} } })();
const TYPOS={"gmial.com":"gmail.com","gmal.com":"gmail.com","gmai.com":"gmail.com","gmail.co":"gmail.com","gmail.con":"gmail.com","gmaill.com":"gmail.com","gnail.com":"gmail.com","gamil.com":"gmail.com","hotmal.com":"hotmail.com","hotmail.co":"hotmail.com","yaho.com":"yahoo.com","yahoo.co":"yahoo.com","outlok.com":"outlook.com","icloud.co":"icloud.com"};
let pendingEmail="";
const msg2=(t,ok)=>{ $("msg2").textContent=t; $("msg2").className="msg "+(ok?"ok":"err"); };
function showCode(email){ pendingEmail=email; $("f").classList.add("hide"); $("tabs").classList.add("hide"); $("codeF").classList.remove("hide");
  $("formTitle").dataset.en="Verify your email"; $("formTitle").dataset.fr="Vérifiez votre email"; window.applyLang(); $("code").focus(); }
$("codeF").onsubmit = async e => { e.preventDefault(); const token=$("code").value.replace(/\D/g,""); if(token.length<6) return msg2(T("Enter the code from the email.","Entrez le code reçu par email."));
  $("codeGo").disabled=true;
  try{ const { data, error } = await sb.auth.verifyOtp({ email:pendingEmail, token, type:"signup" }); if(error) throw error;
    if(data.user) await sb.from("profiles").upsert({ id:data.user.id, email:pendingEmail, referral:$("ref").value.trim()||null });
    location.href="dashboard.html";
  } catch(err){ msg2(T("Wrong or expired code. Check it or tap Resend code.","Code incorrect ou expiré. Vérifiez-le ou touchez Renvoyer le code.")); }
  finally{ $("codeGo").disabled=false; } };
$("resend").onclick = async e => { e.preventDefault(); const { error } = await sb.auth.resend({ type:"signup", email:pendingEmail });
  msg2(error?T("Please wait a minute before asking for a new code.","Attendez une minute avant de redemander un code."):T("New code sent.","Nouveau code envoyé."), !error); };
$("f").onsubmit = async e => { e.preventDefault(); const email=$("email").value.trim().toLowerCase(), password=$("pass").value;
  const dom=email.split("@")[1]||""; if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(email)) return msg(T("Enter a valid email address.","Entrez une adresse email valide."));
  if(TYPOS[dom]) return msg(T("Did you mean @"+TYPOS[dom]+"? Please fix your email.","Vouliez-vous dire @"+TYPOS[dom]+" ? Corrigez votre email."));
  if(dom==="jdaipartnership.com") return msg(T("Use your personal email, not a DJAI email.","Utilisez votre email personnel, pas un email DJAI."));
  $("go").disabled=true;
  try{
    if(mode==="sign"){
      if(!$("agree").checked){ msg(T("Please accept the terms to continue.","Veuillez accepter les conditions pour continuer.")); return; }
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ referral:$("ref").value.trim() } } });
      if(error) throw error;
      if(!data.session){ showCode(email); return; }
      await sb.from("profiles").upsert({ id:data.user.id, email, referral:$("ref").value.trim()||null });
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error && (error.message||"").toLowerCase().includes("not confirmed")){ await sb.auth.resend({ type:"signup", email }); showCode(email); return; }
      if(error) throw error;
    }
    location.href="dashboard.html";
  } catch(err){ const m=(err.message||"").toLowerCase();
    msg(m.includes("already")?T("This email already has an account. Log in instead.","Cet email a déjà un compte. Connectez-vous."):
      m.includes("password should")||m.includes("weak")?T("Password must be at least 8 characters.","Le mot de passe doit contenir au moins 8 caractères."):
      m.includes("invalid login")?T("Email or password is incorrect.","Email ou mot de passe incorrect."):
      m.includes("not confirmed")?T("Please confirm your email first.","Veuillez d'abord confirmer votre email."):
      T("Something went wrong. Please try again.","Une erreur est survenue. Réessayez."));
  } finally { $("go").disabled=false; } };
$("forgot").onclick = async e => { e.preventDefault(); const email=$("email").value.trim(); if(!email) return msg(T("Enter your email first.","Entrez d'abord votre email."));
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname.replace(/apply\.html$/,"") + "reset.html" });
  msg(error?T("Could not send the reset link.","Impossible d'envoyer le lien."):T("Reset link sent. Check your inbox.","Lien envoyé. Vérifiez votre boîte mail."), !error); };
sb.auth.getSession().then(({data}) => { if(data.session) location.href="dashboard.html"; });
if(new URLSearchParams(location.search).get("mode")==="login") setMode("log");
</script>
</body>
</html>
