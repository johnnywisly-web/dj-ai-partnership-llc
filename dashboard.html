    <h3 data-en="3. Record" data-fr="3. Filmer"></h3>

      <li data-en="Wear the phone head mount provided by DJAI. Footage must be first-person and hands-free." data-fr="Portez le support de tête fourni par DJAI. La vidéo doit être à la première personne, mains libres."></li>

      <div><label data-en="Smartphone model" data-fr="Modèle de smartphone"></label><input id="phoneModel" required data-ph-en="iPhone 12+, Galaxy S21+, Pixel 6+" data-ph-fr="iPhone 12+, Galaxy S21+, Pixel 6+"></div>
      <div><label data-en="Do you have a headstrap?" data-fr="Avez-vous un support de tête ?"></label><select id="strap" required><option value="">—</option><option value="yes" data-en="Yes" data-fr="Oui"></option><option value="can-get" data-en="I can get one" data-fr="Je peux en obtenir un"></option><option value="no" data-en="No" data-fr="Non"></option></select></div>
      <div><label data-en="Hours available per week" data-fr="Heures disponibles par semaine"></label><input id="avail" type="number" min="0" max="80"></div>
    </div>
    <label data-en="Work environment you can record (e.g. salon, gym, farm, kitchen)" data-fr="Environnement de travail que vous pouvez filmer (ex. salon, gym, ferme, cuisine)"></label><input id="env">

    <h2 data-en="Payout method" data-fr="Moyen de paiement"></h2>
    <div class="pay">
      <label><input type="radio" name="pm" value="moncash">MonCash</label>
      <label><input type="radio" name="pm" value="natcash">NatCash</label>
      <label><input type="radio" name="pm" value="bank"><span data-en="Bank transfer" data-fr="Virement bancaire"></span></label>
      <label><input type="radio" name="pm" value="payoneer">Payoneer</label>
      <label><input type="radio" name="pm" value="wise">Wise</label>

    <p class="small" data-en="Never enter passwords or PIN codes. We only need the details to send you money." data-fr="N'entrez jamais de mot de passe ni de code PIN. Nous avons seulement besoin des informations pour vous envoyer l'argent."></p>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./supabase-config.js";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id), T = (en, fr) => (window.LANG === "fr" ? fr : en);
const PM = {
  moncash: [["mcName","Name on MonCash account","Nom du compte MonCash"],["mcPhone","MonCash phone number","Numéro MonCash"]],
  natcash: [["ncName","Name on NatCash account","Nom du compte NatCash"],["ncPhone","NatCash (Natcom) phone number","Numéro NatCash (Natcom)"]],
  bank: [["bkHolder","Account holder name","Titulaire du compte"],["bkName","Bank name","Nom de la banque"],["bkAcct","Account number / IBAN","Numéro de compte / IBAN"],["bkSwift","SWIFT / routing (if any)","SWIFT / code (si applicable)"],["bkCountry","Bank country","Pays de la banque"]],
  payoneer: [["poEmail","Payoneer account email","Email du compte Payoneer"]],
  wise: [["wsEmail","Wise account email","Email du compte Wise"],["wsName","Full name on Wise","Nom complet sur Wise"]]
};
const F = { name:"name", phone:"phone", country:"country", city:"city", langs:"langs", phoneModel:"phone_model", strap:"strap", avail:"avail", env:"env" };
let data = {}, user = null, pfOpen = true;
function setPf(open){ pfOpen = open; $("pfBody").classList.toggle("hide", !open);
  $("pfToggle").textContent = open ? T("Collapse ▲","Réduire ▲") : T("Edit ▼","Modifier ▼"); }
$("pfHead").onclick = () => setPf(!pfOpen);
document.addEventListener("langchange", () => setPf(pfOpen));
const isDone = d => !!(d && d.name && d.phone && d.country && d.city && d.payout && d.payout.method);
function renderPM(){ const m = (document.querySelector('input[name=pm]:checked')||{}).value; const box = $("pmFields"); const keep = {};
  box.querySelectorAll("input").forEach(i => keep[i.id] = i.value); box.innerHTML = "";
  (PM[m]||[]).forEach(([id,en,fr]) => { const d=document.createElement("div"); d.innerHTML=`<label data-en="${en}" data-fr="${fr}"></label><input id="${id}" required>`; box.appendChild(d);
    d.querySelector("input").value = keep[id] ?? ((data.payout && data.payout[id]) || ""); }); window.applyLang(); }
document.querySelectorAll('input[name=pm]').forEach(r => r.onchange = renderPM);
(async () => {
  const { data: s } = await sb.auth.getSession();
  if(!s.session){ location.href = "apply.html?mode=login"; return; }
  user = s.session.user; $("who").textContent = ", " + user.email;
  const { data: p } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  if(!p) await sb.from("profiles").upsert({ id:user.id, email:user.email, referral:(user.user_metadata||{}).referral||null });
  data = p || {};
  Object.entries(F).forEach(([el,col]) => { if(data[col]!=null) $(el).value = data[col]; });
  $("status").textContent = (data.status||"applicant").toUpperCase();
  if(data.payout && data.payout.method){ const r=document.querySelector(`input[name=pm][value=${data.payout.method}]`); if(r){ r.checked=true; renderPM(); } }
  const { data: x } = await sb.from("stats").select("*").eq("id", user.id).maybeSingle();
  if(x){ $("sSub").textContent = x.submitted_hours ?? 0; $("sApp").textContent = x.approved_hours ?? 0;
    $("sQual").textContent = x.quality!=null ? x.quality + "%" : "—";
    $("sEarn").textContent = "$" + Number(x.earnings_usd||0).toFixed(2); $("sPaid").textContent = "$" + Number(x.paid_usd||0).toFixed(2); }
  $("pfDone").classList.toggle("hide", !isDone(data)); setPf(!isDone(data));
  loadMinute();
})();
$("pf").onsubmit = async e => { e.preventDefault(); if(!user) return;
  const m = (document.querySelector('input[name=pm]:checked')||{}).value;
  if(!m){ $("msg").className="msg err"; $("msg").textContent=T("Choose a payout method.","Choisissez un moyen de paiement."); return; }
  const payout = { method:m }; (PM[m]||[]).forEach(([id]) => payout[id] = $(id).value.trim());
  const upd = { id:user.id, email:user.email, payout, updated_at:new Date().toISOString() };
  Object.entries(F).forEach(([el,col]) => { const v=$(el).value.trim(); upd[col] = col==="avail" ? (v===""?null:parseInt(v,10)) : v; });
  const { error } = await sb.from("profiles").upsert(upd);
  if(!error){ data = { ...data, ...upd }; $("pfDone").classList.toggle("hide", !isDone(data)); if(isDone(data)) setPf(false); loadMinute(); }
  $("msg").className = "msg " + (error?"err":"ok");
  $("msg").textContent = error ? T("Could not save. Please try again.","Échec de l'enregistrement. Réessayez.") : T("Profile saved. Our team will contact you about next steps.","Profil enregistré. Notre équipe vous contactera pour la suite."); };
$("out").onclick = async () => { await sb.auth.signOut(); location.href="index.html"; };

const esc = t => String(t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let PostalMime = null;
async function loadMinute(){
  const { data: st } = await sb.from("app_settings").select("value").eq("key","minute_org_code").maybeSingle();
  const { data: p } = await sb.from("profiles").select("work_email,name,phone,country,city").eq("id", user.id).maybeSingle();
  const we = p && p.work_email;
  const complete = !!(we && p.name && p.phone && p.country && p.city);
  const code = complete ? ((st && st.value) || "5PNDPR2S") : "—";
  const cn = String((p && p.country) || "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
  const isRoots = !cn || cn === "haiti" || cn === "ayiti" || cn === "haiti (ayiti)";
  const isRD = !isRoots; // Minute for every country except Haiti
  $("minute").classList.toggle("hide", isRD);
  $("minuteRD").classList.toggle("hide", !isRD);
  $("wEmail").textContent = we || "—"; $("wEmailRD").textContent = we || "—";
  $("orgCode").textContent = code; $("orgCodeRD").textContent = code;
  $("orgBox").classList.toggle("hide", !complete); $("orgBoxRD").classList.toggle("hide", !complete);
  $("noEmail").classList.toggle("hide", complete); $("noEmailRD").classList.toggle("hide", complete);
  if(we) loadInbox();
}
async function loadInbox(){
  const { data: rows } = await sb.from("inbox").select("id,from_address,subject,raw,received_at").order("received_at",{ascending:false}).limit(20);
  const box = $("inbox"); if(!rows || !rows.length) return;
  if(!PostalMime){ try { PostalMime = (await import("https://esm.sh/postal-mime@2")).default; } catch(e){} }
  box.innerHTML = "";
  for(const r of rows){
    let text = "";
    try { if(PostalMime){ const m = await PostalMime.parse(r.raw); text = m.text || (m.html||"").replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<[^>]+>/g," ").replace(/\s+/g," "); } } catch(e){}
    if(!text) text = (r.raw||"").split(/\r?\n\r?\n/).slice(1).join("\n").slice(0,3000);
    const code = ((r.subject + " " + text).match(/\b\d{4,8}\b/)||[])[0];
    const d = document.createElement("details"); d.className = "mail";
    d.innerHTML = `<summary>${esc(r.subject||"(no subject)")}</summary><div class="small">${esc(r.from_address)} · ${new Date(r.received_at).toLocaleString()}</div>${code?`<div class="code">${esc(code)}</div>`:""}<pre>${esc(text.slice(0,4000))}</pre>`;
    box.appendChild(d);
  }
}
$("inboxRefresh").onclick = loadInbox;
document.addEventListener("langchange", renderPM);
</script>
